<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>教材伴读</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/textbook-reader/assets/app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          <path d="M8 7h8M8 11h6"></path>
        </svg>
        <h1>教材伴读</h1>
      </div>
      <div class="top-actions">
        <span id="global-status" class="muted small"></span>
        <button id="back-to-library" class="ghost icon-button hidden" type="button" title="书架" aria-label="书架">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            <path d="M8 7h8M8 11h6"></path>
          </svg>
        </button>
        <button id="back-to-chat" class="ghost icon-button hidden" type="button" title="关闭阅读器" aria-label="关闭阅读器">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
        <button id="chat-toggle" class="ghost icon-button hidden" type="button" title="展开 AI 伴读" aria-label="展开 AI 伴读">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </button>
        <button id="refresh" class="ghost icon-button" type="button" title="刷新" aria-label="刷新">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
            <path d="M21 3v6h-6"></path>
          </svg>
        </button>
      </div>
    </header>

    <div id="banner" class="banner hidden" role="status"></div>

    <main id="library-view" class="library-view">
      <div class="library-head">
        <div>
          <h2>我的教材</h2>
          <p class="muted small">PDF 会复制到 ~/.dsh/textbook-reader/；解析使用 MinerU 云端 API。</p>
        </div>
        <div class="row">
          <input id="file" type="file" accept="application/pdf,.pdf" class="hidden">
          <button id="upload" class="primary" type="button">上传 PDF</button>
        </div>
      </div>

      <div id="books" class="cards"></div>
      <div id="empty" class="empty hidden">还没有教材。点击「上传 PDF」开始。</div>

      <details id="settings" class="settings">
        <summary>MinerU 设置</summary>
        <div class="panel settings-panel">
          <div class="field">
            <label for="token">MinerU API token（只保存在本机 0600 文件，界面只回掩码）</label>
            <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴 mineru.net 的 API token">
          </div>
          <div class="row settings-row">
            <button id="save-token" class="primary" type="button">保存 token</button>
            <button id="clear-token" class="ghost" type="button">清除 token</button>
            <span id="token-status" class="muted small">读取中…</span>
          </div>
          <div class="row settings-row">
            <label class="check"><input id="ocr" type="checkbox"> 启用 OCR（扫描版教材需要）</label>
            <label class="check"><input id="table" type="checkbox"> 识别表格</label>
            <button id="save-options" type="button">保存解析选项</button>
          </div>
          <div class="divider"></div>
          <div class="row settings-row">
            <label class="check"><input id="caption-vlm" type="checkbox" disabled> 图注 VLM 描述（预留）</label>
            <span class="pill">默认关闭</span>
            <span class="muted small">MVP 不实现图片外发；关闭时没有任何图注/VLM 请求。</span>
          </div>
        </div>
      </details>
    </main>

    <main id="reader-view" class="reader-view hidden">
      <aside class="reader-side">
        <section class="side-block book-block">
          <div class="book-title-row">
            <h2 id="book-title">教材</h2>
            <span id="parse-pill" class="pill"></span>
          </div>
          <div class="kv"><span>页数</span><b id="book-pages">—</b></div>
          <div class="kv"><span>大小</span><b id="book-size">—</b></div>
          <div class="reader-parse-row">
            <button id="parse" class="primary" type="button">开始解析</button>
            <span id="parse-status" class="muted small"></span>
          </div>
          <div id="parse-error" class="banner error hidden"></div>
        </section>

        <section class="side-block tree-block">
          <div class="side-heading">章节树 <span id="tree-count" class="muted small"></span></div>
          <div id="tree-empty" class="muted small">尚未解析：先配置 token 并开始解析。</div>
          <div id="tree" class="tree"></div>
        </section>

        <details id="progress-block" class="side-block progress-block hidden">
          <summary>学习进度</summary>
          <div id="progress-summary" class="progress-summary"></div>
          <div class="side-heading small">每章掌握度</div>
          <div id="mastery-list" class="mastery-list"></div>
          <div class="divider"></div>
          <div class="side-heading small">疑问清单</div>
          <div class="question-add">
            <input id="question-input" type="text" maxlength="500" placeholder="记下当前页的疑问…">
            <button id="question-add" type="button">添加</button>
          </div>
          <div id="question-list" class="question-list"></div>
        </details>
      </aside>

      <div id="side-backdrop" class="side-backdrop hidden"></div>

      <section class="pdf-panel">
        <div class="pdf-toolbar">
          <button id="toggle-side" class="ghost hidden" type="button" title="目录与进度">目录</button>
          <button id="prev-page" type="button">上一页</button>
          <button id="next-page" type="button">下一页</button>
          <label class="page-jump">第 <input id="page-input" type="number" min="1" step="1"> / <span id="page-total">–</span> 页</label>
          <span class="spacer"></span>
          <button id="zoom-out" type="button" title="缩小">−</button>
          <span id="zoom-label" class="muted small">100%</span>
          <button id="zoom-in" type="button" title="放大">＋</button>
          <button id="zoom-fit" type="button">适宽</button>
          <span id="pdf-status" class="muted small"></span>
        </div>
        <div id="pdf-scroll" class="pdf-scroll">
          <div id="pdf-pages" class="pdf-pages"></div>
          <div id="pdf-loading" class="pdf-loading">正在加载 PDF…</div>
        </div>
      </section>
    </main>
  </div>

  <div id="selection-toolbar" class="selection-toolbar hidden" role="toolbar" aria-label="选中文字操作">
    <span id="selection-summary" class="selection-summary">已选中</span>
    <button id="selection-ask" class="selection-ask" type="button" title="把选中原文带入 AI 伴读">问 AI</button>
    <button id="selection-clear" class="ghost" type="button" title="清除选中" aria-label="清除选中">×</button>
  </div>

  <script type="module" src="/textbook-reader/assets/app.js"></script>
</body>
</html>
